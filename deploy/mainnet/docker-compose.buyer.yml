# deploy/mainnet/docker-compose.buyer.yml — Buyer (Express + Vite UI) — MAINNET
#
# Brought up on vector-marketplace at https://marketplace.vector.apexfusion.org.
# The app has no login: anyone who can reach it can spend from the buyer wallet.
#
# Code-level mainnet safety (env-gate / wallet allowlist / MAINNET=1 flag,
# tracked in ARCHITECTURE.md §9 #5) is still a separate open follow-up.

name: marketplace-mainnet-buyer

services:
  buyer:
    build:
      context: ../..
      dockerfile: buyer/Dockerfile
    container_name: marketplace-mainnet-buyer
    restart: unless-stopped
    # On SIGTERM the buyer finishes in-flight requests (a paid Paper2Agent build
    # model call lasts up to its advert SLA, 300 s) and then its background
    # Accepts (at most 60 s) before it exits.
    stop_grace_period: 330s
    env_file:
      - path: ../../buyer/.env
        required: false
    environment:
      INDEXER_URL: http://marketplace-mainnet-indexer:8090
      BUYER_PORT: "8070"
      # PiperTTS demo (Path B): direct-proxy target for /v1/synth-speech. Piper is
      # private on marketplace-mainnet-net (no public host), so use internal DNS.
      # Without this the demo TTS tile 503s ("booted without TTS_PIPER_BASE_URL").
      TTS_PIPER_BASE_URL: http://marketplace-mainnet-tts-piper:8000
      # Pin the archive dir so it lands on the persistent volume below — keeps
      # the response archive + PDF job store (past summaries) across container
      # recreation/redeploys.
      ARCHIVE_DIR: /repo/data/archive
      # Public base URL of the OpenAI gateway, surfaced to the SPA boot block so
      # the "API Keys" page can POST cross-origin to ${gatewayUrl}/signup. The
      # gateway must CORS-allow https://marketplace.vector.apexfusion.org (see
      # GATEWAY_CORS_ORIGINS in docker-compose.gateway.yml).
      GATEWAY_PUBLIC_URL: https://api.marketplace.vector.apexfusion.org
      # Server-only key inventory connection. GATEWAY_ADMIN_TOKEN in buyer/.env
      # must match gateway/.env; never expose that token in the SPA boot block.
      GATEWAY_INTERNAL_URL: http://marketplace-mainnet-gateway:8080
      SURPLUS_DASHBOARD_URL: http://marketplace-mainnet-surplus-seller:8080/internal/resale-dashboard
      # NETWORK_ID intentionally not pinned — see supplier compose comment.
    volumes:
      - buyer-mainnet-archive:/repo/data/archive
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8070/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - marketplace-mainnet-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.mp-buyer-mainnet.entrypoints=web"
      - "traefik.http.routers.mp-buyer-mainnet.rule=Host(`marketplace.vector.apexfusion.org`)"
      - "traefik.http.services.mp-buyer-mainnet.loadbalancer.server.port=8070"
      # Paper2Agent build model calls take longer than Cloudflare's 100 s origin
      # timeout (HTTP 524). The api host is a direct A record to Traefik; this rule
      # is longer than the gateway's Host() router, so it wins.
      - "traefik.http.routers.mp-buyer-mainnet-p2a-model-tls.entrypoints=websecure"
      - "traefik.http.routers.mp-buyer-mainnet-p2a-model-tls.rule=Host(`api.marketplace.vector.apexfusion.org`) && Path(`/v1/paper2agent/model/chat/completions`)"
      - "traefik.http.routers.mp-buyer-mainnet-p2a-model-tls.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mp-buyer-mainnet-p2a-model-tls.service=mp-buyer-mainnet"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  marketplace-mainnet-net:
    external: true
    name: marketplace-mainnet-net
  traefik-net:
    external: true
    name: traefik-net

volumes:
  buyer-mainnet-archive:
