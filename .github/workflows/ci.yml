name: CI

# One workflow, one required check: the job `gate`.
#
# The job `changes` reads the changed files (scripts/ci/changes.mjs) and switches the other jobs on and off. A job that a change
# does not need is skipped. The job `gate` (if: always) is the only required check of the branch rule: GitHub counts a skipped
# required job as passed, so each check has to go through `gate`, which reads every result in scripts/ci/gate.mjs.
# A new job is not required by anything until it is in `needs` of `gate` and in JOBS of scripts/ci/gate.mjs.
#
# deploy-mainnet.yml starts after this workflow on main (workflow_run, name "CI"): keep the name.
# The design and the rules are in docs/TEST-REVISION.md and docs/TESTING.md.

on:
  # Push runs only for main: deploy-mainnet.yml starts after CI on main.
  # A branch with a pull request runs through the pull_request trigger.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.select.outputs.docs_only }}
      run_typecheck: ${{ steps.select.outputs.run_typecheck }}
      vitest_mode: ${{ steps.select.outputs.vitest_mode }}
      vitest_count: ${{ steps.select.outputs.vitest_count }}
      vitest_files: ${{ steps.select.outputs.vitest_files }}
      vitest_exclude: ${{ steps.select.outputs.vitest_exclude }}
      aiken_eval: ${{ steps.select.outputs.aiken_eval }}
      contracts_identity: ${{ steps.select.outputs.contracts_identity }}
      contracts_legacy: ${{ steps.select.outputs.contracts_legacy }}
      test_lines: ${{ steps.select.outputs.test_lines }}
      source_lines: ${{ steps.select.outputs.source_lines }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The scripts of the CI have their own tests (the table test of the gate, the selection on a small tree).
      - name: Test the CI scripts
        run: node --test scripts/ci/*.test.mjs

      - name: Choose the jobs
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: node scripts/ci/changes.mjs

  typecheck:
    name: typecheck (Node 20)
    needs: changes
    if: needs.changes.outputs.run_typecheck == 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      # Blocking: an error in one of these configs makes tsc-report.mjs exit 1, so the step, the job and the gate fail.
      # tests/identity-deploy/tsconfig.json is checked in the job aiken-eval.
      # The tsc matcher of setup-node would turn each error line into an annotation: remove it. The job summary has the counts.
      - name: Typecheck of the test files
        run: |
          echo "::remove-matcher owner=tsc::"
          node scripts/ci/tsc-report.mjs \
            tests/tsconfig.json \
            gateway/tsconfig.test.json \
            paper2agent/tsconfig.test.json \
            tests/legacy-registry/tsconfig.json \
            tests/identity-builders/tsconfig.json \
            tests/identity-vectors/tsconfig.json

  vitest:
    name: vitest (Node 20)
    needs: changes
    if: needs.changes.outputs.vitest_mode != 'none'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tests evaluate builder transactions with `aiken tx simulate`
      # (tests/unit/identity-tx-*.test.ts, tests/unit/paper2agent-identity-e2e.test.ts). They need aiken v1.1.21.
      - name: Setup aiken
        uses: ./.github/actions/setup-aiken

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The projects `unit` and `ui` of vitest.workspace.ts. The project `aiken-eval` runs in the job `aiken-eval`.
      # mode all: every file of the two projects. mode selected: the files of the job `changes`. The run fails when it ran no file.
      - name: Vitest (projects unit and ui)
        env:
          VITEST_MODE: ${{ needs.changes.outputs.vitest_mode }}
          VITEST_PROJECTS: unit ui
          VITEST_FILES: ${{ needs.changes.outputs.vitest_files }}
          VITEST_EXCLUDE: ${{ needs.changes.outputs.vitest_exclude }}
        run: node scripts/ci/vitest-run.mjs

  aiken-eval:
    name: aiken blueprint + script evaluation (Node 20)
    needs: changes
    if: needs.changes.outputs.aiken_eval == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup aiken
        uses: ./.github/actions/setup-aiken

      - name: Cache aiken packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/aiken/packages
          key: aiken-packages-${{ hashFiles('contracts/*/aiken.lock') }}

      - name: Aiken build (contracts/identity-marketplace)
        working-directory: contracts/identity-marketplace
        run: aiken build

      - name: Committed blueprint equals the build
        working-directory: contracts/identity-marketplace
        run: git diff --exit-code plutus.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the deployment tool
        run: pnpm exec tsc -p tests/identity-deploy/tsconfig.json

      # The project `aiken-eval` of vitest.workspace.ts: tests/legacy-registry (the deployed legacy registry script and adoption),
      # tests/identity-builders (escrow and advert with the shared builders), tests/identity-vectors (vectors, benchmarks, resolver
      # properties) and tests/identity-deploy (the deployment tool: plan, seal and publish transactions, allowlist, resume).
      # The run fails when it ran no file.
      - name: Vitest (project aiken-eval)
        env:
          VITEST_MODE: all
          VITEST_PROJECTS: aiken-eval
        run: node scripts/ci/vitest-run.mjs

      - name: CBOR fixtures equal the Aiken tests
        run: node contracts/identity-marketplace/fixtures/generate.mjs --check

  # `aiken check` of the identity contracts in 4 jobs. One thread each, aiken v1.1.24 on a temporary copy with its own compiler
  # line (the committed aiken.toml keeps v1.1.21). The shard plan is contracts/identity-marketplace/aiken-shards.json.
  aiken-check:
    name: aiken check (shard ${{ matrix.shard }} of 4)
    needs: changes
    if: needs.changes.outputs.contracts_identity == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup aiken v1.1.24
        uses: ./.github/actions/setup-aiken
        with:
          version: v1.1.24

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache aiken packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/aiken/packages
          key: aiken-packages-${{ hashFiles('contracts/*/aiken.lock') }}

      # The maps contracts/identity-marketplace/tests/*.md name tests. Each name must be a test that exists. It reads the .ak files and runs no aiken.
      - name: Maps name existing tests
        run: node scripts/aiken-check-maps

      - name: Aiken check, shard ${{ matrix.shard }} of 4
        run: scripts/aiken-check --shard ${{ matrix.shard }} --of 4 --seed 358316146

  legacy-contract:
    name: legacy contract (aiken check and blueprint)
    needs: changes
    if: needs.changes.outputs.contracts_legacy == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup aiken v1.1.24
        uses: ./.github/actions/setup-aiken
        with:
          version: v1.1.24

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache aiken packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/aiken/packages
          key: aiken-packages-${{ hashFiles('contracts/*/aiken.lock') }}

      - name: Aiken check (contracts/marketplace)
        run: scripts/aiken-check --project contracts/marketplace --all --seed 358316146

      # The blueprint of the legacy contract is built with v1.1.21, the compiler of the deployed code (checked: a v1.1.21 build equals
      # the committed file byte for byte). This step goes after the check above: the second setup puts v1.1.21 first on PATH.
      - name: Setup aiken v1.1.21
        uses: ./.github/actions/setup-aiken

      - name: Aiken build (contracts/marketplace)
        working-directory: contracts/marketplace
        run: aiken build

      - name: Committed legacy blueprint equals the build
        working-directory: contracts/marketplace
        run: git diff --exit-code plutus.json

  # The only required check. It runs after all other jobs, also when one failed or was cancelled.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [changes, typecheck, vitest, aiken-eval, aiken-check, legacy-contract]
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout the CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_TYPECHECK: ${{ needs.typecheck.result }}
          RESULT_VITEST: ${{ needs.vitest.result }}
          RESULT_AIKEN_EVAL: ${{ needs.aiken-eval.result }}
          RESULT_AIKEN_CHECK: ${{ needs.aiken-check.result }}
          RESULT_LEGACY_CONTRACT: ${{ needs.legacy-contract.result }}
          FLAG_TYPECHECK: ${{ needs.changes.outputs.run_typecheck }}
          FLAG_VITEST: ${{ needs.changes.outputs.vitest_mode }}
          FLAG_AIKEN_EVAL: ${{ needs.changes.outputs.aiken_eval }}
          FLAG_AIKEN_CHECK: ${{ needs.changes.outputs.contracts_identity }}
          FLAG_LEGACY_CONTRACT: ${{ needs.changes.outputs.contracts_legacy }}
          TEST_LINES: ${{ needs.changes.outputs.test_lines }}
          SOURCE_LINES: ${{ needs.changes.outputs.source_lines }}
        run: node scripts/ci/gate.mjs
